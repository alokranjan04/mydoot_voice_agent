name: Deploy Mydoot Customer Care to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID:   testcnx-169610
  REGION:       us-central1
  SERVICE_NAME: mydoot-voice-agent
  REGISTRY:     us-central1-docker.pkg.dev
  REPO:         mydoot-repo
  IMAGE:        us-central1-docker.pkg.dev/testcnx-169610/mydoot-repo/mydoot-voice-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mydoot_env          # ← uses the mydoot_env GitHub environment secrets

    permissions:
      contents: read
      id-token: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Auth to GCP ─────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── 3. Docker ──────────────────────────────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Create Artifact Registry repo (idempotent)
        run: |
          gcloud artifacts repositories create ${{ env.REPO }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --description="Mydoot Customer Care Voice Agent" || true

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # ── 4. Build env-vars file (safe handling for JSON values) ─────────────
      # Cloud Run's --env-vars-file accepts YAML key: "value" pairs.
      # We use Python to write the file so JSON blobs (GOOGLE_CREDENTIALS)
      # are properly escaped regardless of shell special characters.
      - name: Build Cloud Run env-vars file
        env:
          SARVAM_API_KEY:        ${{ secrets.SARVAM_API_KEY }}
          DEEPGRAM_API_KEY:      ${{ secrets.DEEPGRAM_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          ELEVEN_LABS_API_KEY:   ${{ secrets.ELEVEN_LABS_API_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GMAIL_USER:            ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          DOCTOR_EMAIL:          ${{ secrets.DOCTOR_EMAIL }}
          PUBLIC_URL:            ${{ secrets.PUBLIC_URL }}
          # GOOGLE_CREDENTIALS reuses the deployment SA key for Sheets access.
          # If you use a separate Sheets SA, add a GOOGLE_CREDENTIALS secret.
          GOOGLE_CREDENTIALS:    ${{ secrets.GCP_SA_KEY }}
          GCS_RECORDINGS_BUCKET: ${{ secrets.GCS_RECORDINGS_BUCKET }}
          GCS_DELETE_LOCAL:      ${{ secrets.GCS_DELETE_LOCAL }}
        run: |
          python3 - <<'PYEOF'
          import os, json

          keys = [
              "SARVAM_API_KEY",
              "DEEPGRAM_API_KEY",
              "GEMINI_API_KEY",
              "ELEVEN_LABS_API_KEY",
              "GOOGLE_SPREADSHEET_ID",
              "GMAIL_USER",
              "GMAIL_APP_PASSWORD",
              "DOCTOR_EMAIL",
              "PUBLIC_URL",
              "GOOGLE_CREDENTIALS",
              "GCS_RECORDINGS_BUCKET",
              "GCS_DELETE_LOCAL",
          ]

          lines = []
          for k in keys:
              val = os.environ.get(k, "")
              if val:                        # skip empty / unset secrets
                  lines.append(f"{k}: {json.dumps(val)}")

          with open("/tmp/env.yaml", "w") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Wrote {len(lines)} env vars to /tmp/env.yaml")
          PYEOF

      # ── 5. Deploy to Cloud Run ─────────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --timeout=3600 \
            --concurrency=80 \
            --min-instances=1 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --env-vars-file=/tmp/env.yaml

      # ── 6. Print the live URL ──────────────────────────────────────────────
      - name: Print service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "### Deployed: $URL" >> $GITHUB_STEP_SUMMARY
          echo "Vobiz Answer URL: POST $URL/answer"
          echo "Dashboard:        $URL/"
          echo "Voice Lab:        $URL/voice-lab"
